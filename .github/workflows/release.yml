name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Match tag and package version
        run: node -e "if ('v' + JSON.parse(require('fs').readFileSync('package.json')).version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Verify committed bundles
        run: git diff --exit-code -- dist
      - name: Package source and ready-to-import assets
        run: git archive --format=zip --output=lnreader-rpg-${GITHUB_REF_NAME}.zip HEAD
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/lnreader-rpg.js dist/lnreader-rpg.min.js dist/lnreader-rpg.css dist/SHA256SUMS.txt "lnreader-rpg-${GITHUB_REF_NAME}.zip" --verify-tag --title "LNReader RPG Formatter $GITHUB_REF_NAME" --notes-file CHANGELOG.md
